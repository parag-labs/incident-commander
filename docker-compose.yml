# Bring the incident commander up locally with `docker compose up`.
# It runs with the deterministic mock model by default (no API key needed).
# To use a live model, set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL in the environment.
services:
  incident-commander:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      AUTO_APPROVE_MEDIUM: "true"
      # LLM_BASE_URL: "https://api.openai.com/v1"
      # LLM_API_KEY: "sk-..."
      # LLM_MODEL: "gpt-4o-mini"
