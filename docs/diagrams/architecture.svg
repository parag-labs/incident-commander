anslate(1336,211) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="1366" y="227" font-size="16.5" font-weight="700" fill="#8c5a0d">Human approval</text><text x="1337" y="249.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">WAITING_FOR_APPROVAL</text><text x="1337" y="266.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">HIGH never auto-runs</text><text x="1337" y="284.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">only the approve route</text><rect x="1320" y="356" width="212" height="104" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,371) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="1366" y="387" font-size="16.5" font-weight="700" fill="#17509f">Remediate</text><text x="1337" y="409.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">run on the simulator</text><text x="1337" y="426.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">verify metrics recovered</text><text x="1337" y="444.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">else VERIFICATION_FAILED</text><rect x="1320" y="512" width="212" height="96" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,527) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="1366" y="543" font-size="16.5" font-weight="700" fill="#186547">Report</text><text x="1337" y="565.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">evidence-backed</text><text x="1337" y="582.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">full transition history</text><rect x="392" y="556" width="250" height="176" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(505.0,570) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="517.0" y="614" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">LLM investigator</text><text x="517.0" y="635.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the single model step</text><text x="517.0" y="652.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">proposes a diagnosis (JSON)</text><text x="517.0" y="670.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">root cause + hypotheses</text><text x="517.0" y="688.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">never sets state / executes</text><rect x="700" y="556" width="236" height="176" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(806.0,570) scale(1.0000)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="818.0" y="614" text-anchor="middle" font-size="16.5" font-weight="700" fill="#9e2b36">Validate</text><text x="818.0" y="635.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">real tool? real service?</text><text x="818.0" y="652.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">cited evidence exists?</text><text x="818.0" y="670.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">confidence in [0,1]?</text><text x="818.0" y="688.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">bad output -&gt; human</text><rect x="994" y="556" width="250" height="176" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1107.0,570) scale(1.0000)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="1119.0" y="614" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8c5a0d">Risk gate</text><text x="1119.0" y="635.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">low: auto</text><text x="1119.0" y="652.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">medium: if enabled</text><text x="1119.0" y="670.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">high: never auto</text><text x="1119.0" y="688.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the tool's declared level</text><path d="M348,239 L412,229" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="355.6" y="222.0" width="48.8" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="380.0" y="238.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">open</text><path d="M348,349 L412,341" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="359.2" y="333.0" width="41.599999999999994" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="380.0" y="349.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">env</text><path d="M635,273 L635,298" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M635,410 L635,385" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="602.824" y="385.5" width="64.352" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="635.0" y="401.94" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">results</text><path d="M856,341 L946,320" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="863.712" y="318.5" width="74.576" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="901.0" y="334.94" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">evidence</text><path d="M1071,368 L1071.0,513.0 Q1071,528 1056.0,528.0 L531.0,528.0 Q517,528 517.0,542.0 L517,556" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="752.5360000000001" y="516.0" width="82.928" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="794" y="532.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">the bundle</text><path d="M642,644 L700,644" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="631.624" y="632.0" width="78.752" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="671.0" y="648.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">diagnosis</text><path d="M936,644 L994,644" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="940.024" y="632.0" width="49.952" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="965.0" y="648.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">valid</text><path d="M1150,556 L1150.0,455.0 Q1150,440 1165.0,440.0 L1205.0,440.0 Q1220,440 1220.0,425.0 L1220.0,259.0 Q1220,244 1235.0,244.0 L1320,244" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><rect x="1096.224" y="463.0" width="107.552" height="24.0" rx="12" fill="#ffffff" stroke="#e0a13a" stroke-opacity="0.4"/><text x="1150" y="479.44" text-anchor="middle" font-size="12" font-weight="600" fill="#8c5a0d">needs a human</text><path d="M1240,556 L1240.0,419.0 Q1240,404 1255.0,404.0 L1320,404" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="1217.112" y="488.0" width="45.775999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1240" y="504.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">auto</text><path d="M1426,292 L1426,356" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="1387.2" y="312.0" width="77.6" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="1426.0" y="328.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">approved</text><path d="M1426,452 L1426,512" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="1388.712" y="470.0" width="74.576" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1426.0" y="486.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">resolved</text><rect x="48" y="792" width="726" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="816" font-size="13.2" font-weight="700" fill="#8c5a0d">The model proposes; deterministic code disposes</text><text x="64" y="838" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">The model proposes one thing - a diagnosis. Everything it emits is hard-</text><text x="64" y="856.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">validated (real tool? cited evidence? confidence in range?) and pushed through</text><text x="64" y="874.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">the risk gate; bad output fails safe to a human, and HIGH never runs on its own.</text><rect x="820" y="792" width="732" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="836" y="816" font-size="13.2" font-weight="700" fill="#186547">One deterministic core, six languages</text><text x="836" y="838" font-size="12.4" fill="#186547" fill-opacity="0.92">models . statemachine . policy . eval . metrics ported to Python, Rust, C#,</text><text x="836" y="856.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Java, TypeScript - byte-identical (round-half-to-even %.0f, ordinal sort).</text><text x="836" y="874.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Agent, tools, HTTP + MCP, simulator and storage stay in Go.</text><text x="800.0" y="962" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/incident-commander</text></svg>